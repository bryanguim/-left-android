name: Construire l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk Left.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Left-apk
          path: Left.apk

      - name: Publier dans Releases (téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Left 1.0.${{ github.run_number }}
          files: Left.apk
